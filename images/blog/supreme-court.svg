<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Coverage of Supreme Court Developments – UK Supreme Court and legal updates">
  <title>Coverage of Supreme Court Developments</title>
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1a"/>
      <stop offset="55%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#162d54"/>
    </linearGradient>
    <linearGradient id="sc-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="sc-building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3468"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="sc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c178"/>
      <stop offset="100%" stop-color="#a8872d"/>
    </linearGradient>
    <linearGradient id="sc-dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="60%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5a4209"/>
    </linearGradient>
    <linearGradient id="sc-steps" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162d54"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="sc-gavel-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2a0a"/>
      <stop offset="100%" stop-color="#1a1205"/>
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sc-goldglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sc-stars" x="0" y="0" width="60" height="40" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="10" r="0.8" fill="#c9a84c" opacity="0.25"/>
      <circle cx="42" cy="25" r="0.6" fill="#c9a84c" opacity="0.2"/>
      <circle cx="28" cy="35" r="0.5" fill="#c9a84c" opacity="0.15"/>
      <circle cx="55" cy="8" r="0.7" fill="#c9a84c" opacity="0.18"/>
      <circle cx="5" cy="30" r="0.6" fill="#c9a84c" opacity="0.2"/>
    </pattern>
    <clipPath id="sc-clip"><rect width="800" height="450"/></clipPath>
  </defs>

  <g clip-path="url(#sc-clip)">
    <!-- Background / night sky -->
    <rect width="800" height="450" fill="url(#sc-bg)"/>
    <!-- Stars pattern -->
    <rect width="800" height="260" fill="url(#sc-stars)"/>
    <!-- Horizon glow -->
    <ellipse cx="400" cy="290" rx="350" ry="80" fill="#c9a84c" opacity="0.04"/>

    <!-- === GROUND / PLAZA === -->
    <rect x="0" y="340" width="800" height="110" fill="#08111e"/>
    <rect x="0" y="338" width="800" height="3" fill="#c9a84c" opacity="0.25"/>
    <!-- Plaza tiles perspective lines -->
    <line x1="0" y1="340" x2="400" y2="360" stroke="#c9a84c" stroke-width="0.4" opacity="0.08"/>
    <line x1="200" y1="340" x2="400" y2="360" stroke="#c9a84c" stroke-width="0.4" opacity="0.06"/>
    <line x1="400" y1="340" x2="400" y2="360" stroke="#c9a84c" stroke-width="0.4" opacity="0.06"/>
    <line x1="600" y1="340" x2="400" y2="360" stroke="#c9a84c" stroke-width="0.4" opacity="0.06"/>
    <line x1="800" y1="340" x2="400" y2="360" stroke="#c9a84c" stroke-width="0.4" opacity="0.08"/>

    <!-- === COURTHOUSE BUILDING === -->
    <!-- Foundation / podium -->
    <rect x="120" y="310" width="560" height="32" rx="2" fill="#0a1626" filter="url(#sc-shadow)"/>
    <rect x="120" y="306" width="560" height="8" rx="1" fill="#162d54"/>
    <rect x="110" y="314" width="580" height="6" rx="1" fill="#1a3468"/>

    <!-- Steps -->
    <rect x="150" y="322" width="500" height="8" rx="1" fill="url(#sc-steps)" opacity="0.8"/>
    <rect x="140" y="330" width="520" height="8" rx="1" fill="url(#sc-steps)" opacity="0.7"/>
    <rect x="130" y="338" width="540" height="5" rx="1" fill="url(#sc-steps)" opacity="0.6"/>

    <!-- Main building body -->
    <rect x="140" y="120" width="520" height="192" rx="2" fill="url(#sc-building)" filter="url(#sc-shadow)"/>

    <!-- Building top cornice / entablature -->
    <rect x="128" y="112" width="544" height="14" rx="2" fill="#1a3468"/>
    <rect x="122" y="104" width="556" height="12" rx="2" fill="#243d6b"/>
    <rect x="118" y="98" width="564" height="8" rx="1" fill="#c9a84c" opacity="0.3"/>

    <!-- === PEDIMENT (triangular roof) === -->
    <polygon points="118,104 400,30 682,104" fill="#162d54" filter="url(#sc-shadow)"/>
    <polygon points="118,104 400,30 682,104" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
    <!-- Pediment inner triangle -->
    <polygon points="150,104 400,46 650,104" fill="#1a3468" opacity="0.6"/>
    <!-- Pediment glow line (gold edge) -->
    <polygon points="118,104 400,30 682,104" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.25"/>

    <!-- === DOME === -->
    <!-- Dome base drum -->
    <rect x="340" y="28" width="120" height="22" rx="3" fill="#162d54"/>
    <rect x="336" y="26" width="128" height="6" rx="2" fill="#c9a84c" opacity="0.5"/>
    <!-- Dome hemisphere -->
    <ellipse cx="400" cy="28" rx="64" ry="40" fill="url(#sc-dome)" filter="url(#sc-goldglow)"/>
    <!-- Dome highlight -->
    <ellipse cx="384" cy="14" rx="20" ry="10" fill="#e2c178" opacity="0.2"/>
    <!-- Dome lantern (top) -->
    <rect x="393" y="-12" width="14" height="16" rx="3" fill="url(#sc-gold)"/>
    <circle cx="400" cy="-14" r="5" fill="#e2c178"/>
    <!-- Dome glow -->
    <ellipse cx="400" cy="28" rx="70" ry="44" fill="#c9a84c" opacity="0.06" filter="url(#sc-glow)"/>

    <!-- === COLUMNS (8 Doric columns) === -->
    <!-- Left set (3 columns) -->
    <rect x="155" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.95"/>
    <rect x="155" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="155" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="155" y="120" width="8" height="192" rx="1" fill="#2a4a7a" opacity="0.4"/>

    <rect x="210" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.9"/>
    <rect x="210" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="210" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="210" y="120" width="8" height="192" rx="1" fill="#2a4a7a" opacity="0.35"/>

    <rect x="265" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.85"/>
    <rect x="265" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="265" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>

    <!-- Center columns (2, flanking entrance) -->
    <rect x="330" y="120" width="24" height="192" rx="2" fill="#2a4a7a" opacity="0.8"/>
    <rect x="330" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.55"/>
    <rect x="330" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.55"/>

    <rect x="446" y="120" width="24" height="192" rx="2" fill="#2a4a7a" opacity="0.8"/>
    <rect x="446" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.55"/>
    <rect x="446" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.55"/>

    <!-- Right set (3 columns) -->
    <rect x="511" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.85"/>
    <rect x="511" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="511" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>

    <rect x="566" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.9"/>
    <rect x="566" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="566" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="574" y="120" width="8" height="192" rx="1" fill="#2a4a7a" opacity="0.35"/>

    <rect x="621" y="120" width="24" height="192" rx="2" fill="#243d6b" opacity="0.95"/>
    <rect x="621" y="118" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="621" y="308" width="24" height="6" rx="1" fill="#c9a84c" opacity="0.5"/>
    <rect x="629" y="120" width="8" height="192" rx="1" fill="#2a4a7a" opacity="0.4"/>

    <!-- === MAIN ENTRANCE DOOR === -->
    <rect x="356" y="218" width="88" height="94" rx="3" fill="#06101e"/>
    <!-- Door arch -->
    <rect x="356" y="218" width="88" height="12" rx="6" fill="#0a1626"/>
    <!-- Door panels -->
    <rect x="362" y="228" width="35" height="76" rx="2" fill="#0a1626"/>
    <rect x="403" y="228" width="35" height="76" rx="2" fill="#0a1626"/>
    <!-- Door handles (gold) -->
    <rect x="393" y="262" width="5" height="18" rx="2" fill="#c9a84c" opacity="0.8"/>
    <rect x="403" y="262" width="5" height="18" rx="2" fill="#c9a84c" opacity="0.8"/>
    <!-- Door frame (gold) -->
    <rect x="356" y="218" width="88" height="94" rx="3" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.4"/>
    <!-- Entrance light -->
    <ellipse cx="400" cy="220" rx="40" ry="10" fill="#c9a84c" opacity="0.08"/>

    <!-- Building windows (flanking) -->
    <!-- Left windows -->
    <rect x="170" y="148" width="52" height="38" rx="2" fill="#060f1e"/>
    <rect x="170" y="148" width="52" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <line x1="196" y1="148" x2="196" y2="186" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>
    <line x1="170" y1="167" x2="222" y2="167" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>

    <rect x="170" y="208" width="52" height="38" rx="2" fill="#060f1e"/>
    <rect x="170" y="208" width="52" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <line x1="196" y1="208" x2="196" y2="246" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>

    <rect x="280" y="148" width="40" height="38" rx="2" fill="#060f1e"/>
    <rect x="280" y="148" width="40" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

    <!-- Right windows (mirrored) -->
    <rect x="578" y="148" width="52" height="38" rx="2" fill="#060f1e"/>
    <rect x="578" y="148" width="52" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <line x1="604" y1="148" x2="604" y2="186" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>
    <line x1="578" y1="167" x2="630" y2="167" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>

    <rect x="578" y="208" width="52" height="38" rx="2" fill="#060f1e"/>
    <rect x="578" y="208" width="52" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <line x1="604" y1="208" x2="604" y2="246" stroke="#c9a84c" stroke-width="0.7" opacity="0.25"/>

    <rect x="480" y="148" width="40" height="38" rx="2" fill="#060f1e"/>
    <rect x="480" y="148" width="40" height="38" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

    <!-- === GAVEL (foreground, left side) === -->
    <g transform="translate(85, 270) rotate(-35, 60, 50)" filter="url(#sc-shadow)">
      <!-- Handle -->
      <rect x="40" y="28" width="14" height="110" rx="6" fill="#3a2510"/>
      <rect x="42" y="28" width="6" height="110" rx="3" fill="#4a3015" opacity="0.6"/>
      <!-- Head -->
      <rect x="10" y="14" width="76" height="32" rx="6" fill="url(#sc-gavel-head)"/>
      <rect x="10" y="14" width="76" height="10" rx="4" fill="#4a3015" opacity="0.5"/>
      <!-- Head strike face (gold band) -->
      <rect x="10" y="18" width="8" height="24" rx="2" fill="#c9a84c" opacity="0.8"/>
      <rect x="78" y="18" width="8" height="24" rx="2" fill="#c9a84c" opacity="0.8"/>
      <!-- Head highlight -->
      <rect x="10" y="14" width="76" height="4" rx="2" fill="#5a4020" opacity="0.5"/>
    </g>

    <!-- Gavel block -->
    <g transform="translate(65, 348)" filter="url(#sc-shadow)">
      <rect x="0" y="0" width="95" height="20" rx="4" fill="#2a1a08"/>
      <rect x="0" y="0" width="95" height="6" rx="3" fill="#3a2510"/>
      <rect x="5" y="2" width="85" height="3" rx="1" fill="#4a3015" opacity="0.5"/>
    </g>

    <!-- === BOTTOM LABEL BAR === -->
    <rect x="0" y="405" width="800" height="45" fill="#000" opacity="0.4"/>
    <rect x="0" y="405" width="800" height="2" fill="#c9a84c" opacity="0.5"/>
    <!-- Category pill -->
    <rect x="30" y="418" width="110" height="22" rx="11" fill="#c9a84c" opacity="0.2"/>
    <rect x="30" y="418" width="110" height="22" rx="11" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <text x="85" y="433" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.9">CASE LAW</text>
    <text x="400" y="432" font-family="Georgia, serif" font-size="12" fill="#c9a84c" text-anchor="middle" letter-spacing="3" opacity="0.6">LAMZAI SOLICITORS</text>
    <text x="762" y="432" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="end" letter-spacing="1" opacity="0.55">JANUARY 2026</text>

    <!-- Corner brackets -->
    <path d="M18,18 L18,46 M18,18 L46,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,18 L782,46 M782,18 L754,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M18,395 L18,367 M18,395 L46,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,395 L782,367 M782,395 L754,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <rect x="8" y="8" width="784" height="434" fill="none" stroke="#c9a84c" stroke-width="0.75" opacity="0.2"/>
  </g>
</svg>
