<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Who Can a Victim Sue After a Car Accident? – Road traffic accident legal guidance">
  <title>Who Can a Victim Sue After a Car Accident?</title>
  <defs>
    <linearGradient id="ca-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="50%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#102040"/>
    </linearGradient>
    <linearGradient id="ca-road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="ca-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c178"/>
      <stop offset="100%" stop-color="#a8872d"/>
    </linearGradient>
    <linearGradient id="ca-car1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243d6b"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="ca-car2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3468"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="ca-scales-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8872d"/>
      <stop offset="50%" stop-color="#e2c178"/>
      <stop offset="100%" stop-color="#a8872d"/>
    </linearGradient>
    <linearGradient id="ca-doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#dfd8c8"/>
    </linearGradient>
    <filter id="ca-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="ca-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ca-goldglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ca-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#c9a84c" opacity="0.18"/>
    </pattern>
    <clipPath id="ca-clip"><rect width="800" height="450"/></clipPath>
  </defs>

  <g clip-path="url(#ca-clip)">
    <!-- Background -->
    <rect width="800" height="450" fill="url(#ca-bg)"/>
    <rect width="800" height="450" fill="url(#ca-dots)"/>

    <!-- === ROAD === -->
    <!-- Road surface -->
    <rect x="0" y="280" width="800" height="130" fill="url(#ca-road)"/>
    <!-- Road edge lines -->
    <rect x="0" y="278" width="800" height="3" fill="#c9a84c" opacity="0.3"/>
    <rect x="0" y="408" width="800" height="2" fill="#c9a84c" opacity="0.15"/>
    <!-- Road lane markings (dashed centre line) -->
    <line x1="0" y1="345" x2="800" y2="345" stroke="#c9a84c" stroke-width="2" stroke-dasharray="40,30" opacity="0.2"/>
    <!-- Road shoulder lines -->
    <rect x="0" y="290" width="800" height="2" fill="#c9a84c" opacity="0.12"/>
    <rect x="0" y="400" width="800" height="2" fill="#c9a84c" opacity="0.12"/>

    <!-- Perspective road lines (vanishing point) -->
    <line x1="0" y1="280" x2="400" y2="240" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>
    <line x1="800" y1="280" x2="400" y2="240" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>

    <!-- Road glow (headlights) -->
    <ellipse cx="220" cy="310" rx="180" ry="40" fill="#c9a84c" opacity="0.05"/>

    <!-- === CAR 1 (LEFT, angled – struck car) === -->
    <g transform="translate(110, 240) rotate(-8,100,50)">
      <!-- Car shadow -->
      <ellipse cx="100" cy="90" rx="110" ry="18" fill="#000" opacity="0.4"/>
      <!-- Car body lower -->
      <rect x="10" y="48" width="190" height="42" rx="6" fill="url(#ca-car1)"/>
      <!-- Car roof/cabin -->
      <rect x="38" y="14" width="134" height="40" rx="10" fill="#1a3468"/>
      <!-- Windscreen -->
      <rect x="50" y="18" width="88" height="30" rx="5" fill="#0a1626" opacity="0.8"/>
      <rect x="52" y="19" width="84" height="14" rx="3" fill="#162d54" opacity="0.5"/>
      <!-- Front bumper -->
      <rect x="0" y="58" width="16" height="24" rx="3" fill="#0d1f3c"/>
      <!-- Rear bumper -->
      <rect x="194" y="58" width="16" height="24" rx="3" fill="#0d1f3c"/>
      <!-- Front headlights -->
      <rect x="2" y="60" width="10" height="8" rx="2" fill="#c9a84c" opacity="0.7"/>
      <!-- Rear lights -->
      <rect x="196" y="60" width="10" height="8" rx="2" fill="#8B1414" opacity="0.8"/>
      <!-- Wheels -->
      <circle cx="46" cy="88" r="18" fill="#060f1e"/>
      <circle cx="46" cy="88" r="12" fill="#1a1a2e"/>
      <circle cx="46" cy="88" r="6" fill="#c9a84c" opacity="0.5"/>
      <circle cx="162" cy="88" r="18" fill="#060f1e"/>
      <circle cx="162" cy="88" r="12" fill="#1a1a2e"/>
      <circle cx="162" cy="88" r="6" fill="#c9a84c" opacity="0.5"/>
      <!-- Damage marks -->
      <line x1="190" y1="30" x2="210" y2="50" stroke="#8B1414" stroke-width="2" opacity="0.7"/>
      <line x1="196" y1="28" x2="218" y2="44" stroke="#8B1414" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- === CAR 2 (RIGHT, slightly behind/at angle) === -->
    <g transform="translate(490, 248) rotate(5,90,45)">
      <!-- Car shadow -->
      <ellipse cx="90" cy="82" rx="100" ry="15" fill="#000" opacity="0.35"/>
      <!-- Car body -->
      <rect x="8" y="42" width="176" height="38" rx="6" fill="url(#ca-car2)"/>
      <!-- Roof -->
      <rect x="32" y="12" width="122" height="36" rx="9" fill="#162d54"/>
      <!-- Windscreen -->
      <rect x="44" y="16" width="82" height="26" rx="4" fill="#0a1626" opacity="0.85"/>
      <rect x="46" y="17" width="78" height="12" rx="2" fill="#1a3468" opacity="0.4"/>
      <!-- Bumpers -->
      <rect x="0" y="50" width="14" height="22" rx="3" fill="#0d1f3c"/>
      <rect x="180" y="50" width="14" height="22" rx="3" fill="#0d1f3c"/>
      <!-- Headlights -->
      <rect x="2" y="54" width="8" height="7" rx="2" fill="#c9a84c" opacity="0.6"/>
      <!-- Rear lights -->
      <rect x="182" y="54" width="8" height="7" rx="2" fill="#8B1414" opacity="0.7"/>
      <!-- Wheels -->
      <circle cx="40" cy="78" r="16" fill="#060f1e"/>
      <circle cx="40" cy="78" r="10" fill="#1a1a2e"/>
      <circle cx="40" cy="78" r="5" fill="#c9a84c" opacity="0.4"/>
      <circle cx="148" cy="78" r="16" fill="#060f1e"/>
      <circle cx="148" cy="78" r="10" fill="#1a1a2e"/>
      <circle cx="148" cy="78" r="5" fill="#c9a84c" opacity="0.4"/>
    </g>

    <!-- Impact spark/debris -->
    <g transform="translate(415,265)" opacity="0.7">
      <circle cx="0" cy="0" r="4" fill="#c9a84c" filter="url(#ca-glow)"/>
      <line x1="0" y1="0" x2="18" y2="-12" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="0" x2="-14" y2="-16" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="0" x2="20" y2="8" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-8" y2="14" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="10" y2="-22" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>
    </g>

    <!-- === LEGAL DOCUMENT OVERLAY (top right) === -->
    <g transform="translate(555, 55)" filter="url(#ca-shadow)">
      <!-- Paper shadow/back sheet -->
      <rect x="6" y="6" width="175" height="220" rx="3" fill="#c9a84c" opacity="0.12"/>
      <!-- Main document -->
      <rect x="0" y="0" width="175" height="220" rx="4" fill="url(#ca-doc)"/>
      <!-- Gold header bar -->
      <rect x="0" y="0" width="175" height="8" rx="2" fill="#c9a84c" opacity="0.8"/>
      <!-- Title -->
      <rect x="14" y="20" width="147" height="8" rx="2" fill="#0d1f3c" opacity="0.65"/>
      <!-- Sub -->
      <rect x="14" y="35" width="110" height="5" rx="2" fill="#0d1f3c" opacity="0.45"/>
      <!-- Divider -->
      <rect x="14" y="48" width="147" height="1.5" rx="0.75" fill="#c9a84c" opacity="0.45"/>
      <!-- Body text lines -->
      <rect x="14" y="58" width="147" height="4.5" rx="2" fill="#0d1f3c" opacity="0.4"/>
      <rect x="14" y="70" width="130" height="4.5" rx="2" fill="#0d1f3c" opacity="0.38"/>
      <rect x="14" y="82" width="140" height="4.5" rx="2" fill="#0d1f3c" opacity="0.36"/>
      <rect x="14" y="94" width="115" height="4.5" rx="2" fill="#0d1f3c" opacity="0.34"/>
      <rect x="14" y="112" width="147" height="4.5" rx="2" fill="#0d1f3c" opacity="0.32"/>
      <rect x="14" y="124" width="125" height="4.5" rx="2" fill="#0d1f3c" opacity="0.3"/>
      <rect x="14" y="136" width="135" height="4.5" rx="2" fill="#0d1f3c" opacity="0.28"/>
      <rect x="14" y="148" width="105" height="4.5" rx="2" fill="#0d1f3c" opacity="0.25"/>
      <rect x="14" y="166" width="147" height="4.5" rx="2" fill="#0d1f3c" opacity="0.25"/>
      <rect x="14" y="178" width="118" height="4.5" rx="2" fill="#0d1f3c" opacity="0.22"/>
      <!-- Signature line -->
      <rect x="14" y="198" width="100" height="1.5" rx="0.75" fill="#0d1f3c" opacity="0.35"/>
      <rect x="14" y="208" width="60" height="3" rx="1" fill="#0d1f3c" opacity="0.3"/>
    </g>

    <!-- === SCALES OF JUSTICE (left-centre, main focal element) === -->
    <g transform="translate(245, 52)" filter="url(#ca-goldglow)">
      <!-- Glow aura -->
      <circle cx="0" cy="130" r="90" fill="#c9a84c" opacity="0.05"/>
      <!-- Base -->
      <rect x="-25" y="242" width="50" height="10" rx="5" fill="url(#ca-gold)"/>
      <rect x="-8" y="226" width="16" height="18" rx="3" fill="url(#ca-gold)"/>
      <!-- Rod -->
      <rect x="-4" y="30" width="8" height="198" rx="3" fill="url(#ca-gold)"/>
      <!-- Top ornament -->
      <circle cx="0" cy="26" r="9" fill="url(#ca-gold)"/>
      <circle cx="0" cy="26" r="5" fill="#e2c178"/>
      <!-- Horizontal beam -->
      <rect x="-95" y="36" width="190" height="6" rx="3" fill="url(#ca-scales-beam)"/>
      <!-- Pivot -->
      <circle cx="0" cy="39" r="6" fill="#e2c178"/>
      <!-- Left chain -->
      <line x1="-92" y1="42" x2="-85" y2="105" stroke="#c9a84c" stroke-width="2.5" opacity="0.85"/>
      <line x1="-85" y1="105" x2="-70" y2="105" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
      <!-- Left pan -->
      <ellipse cx="-81" cy="110" rx="32" ry="8" fill="url(#ca-gold)" opacity="0.85"/>
      <!-- Right chain (lower – unbalanced/tipped) -->
      <line x1="92" y1="42" x2="85" y2="118" stroke="#c9a84c" stroke-width="2.5" opacity="0.85"/>
      <line x1="85" y1="118" x2="70" y2="118" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
      <!-- Right pan (lower) -->
      <ellipse cx="81" cy="124" rx="32" ry="8" fill="url(#ca-gold)" opacity="0.85"/>
    </g>

    <!-- === BOTTOM LABEL BAR === -->
    <rect x="0" y="405" width="800" height="45" fill="#000" opacity="0.4"/>
    <rect x="0" y="405" width="800" height="2" fill="#c9a84c" opacity="0.5"/>
    <!-- Category pill -->
    <rect x="30" y="418" width="140" height="22" rx="11" fill="#c9a84c" opacity="0.2"/>
    <rect x="30" y="418" width="140" height="22" rx="11" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <text x="100" y="433" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.9">PERSONAL INJURY</text>
    <text x="400" y="432" font-family="Georgia, serif" font-size="12" fill="#c9a84c" text-anchor="middle" letter-spacing="3" opacity="0.6">LAMZAI SOLICITORS</text>
    <text x="762" y="432" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="end" letter-spacing="1" opacity="0.55">FEBRUARY 2026</text>

    <!-- Corner brackets -->
    <path d="M18,18 L18,46 M18,18 L46,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,18 L782,46 M782,18 L754,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M18,395 L18,367 M18,395 L46,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,395 L782,367 M782,395 L754,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <rect x="8" y="8" width="784" height="434" fill="none" stroke="#c9a84c" stroke-width="0.75" opacity="0.2"/>
  </g>
</svg>
