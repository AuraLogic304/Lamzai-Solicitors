<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Tips for Choosing a Lawyer Specialty – Legal documents with magnifying glass">
  <title>Tips for Choosing a Lawyer Specialty</title>
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080f1e"/>
      <stop offset="60%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#1a3468"/>
    </linearGradient>
    <linearGradient id="cl-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c178"/>
      <stop offset="100%" stop-color="#a8872d"/>
    </linearGradient>
    <linearGradient id="cl-doc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f4ed"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="cl-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <filter id="cl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="cl-goldglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cl-brightglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="cl-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#c9a84c" opacity="0.2"/>
    </pattern>
    <clipPath id="cl-clip"><rect width="800" height="450"/></clipPath>
  </defs>

  <g clip-path="url(#cl-clip)">
    <!-- Background -->
    <rect width="800" height="450" fill="url(#cl-bg)"/>
    <rect width="800" height="450" fill="url(#cl-dots)"/>

    <!-- Background scales of justice (large, ghosted) -->
    <g transform="translate(680, 40)" opacity="0.07">
      <rect x="-4" y="60" width="8" height="280" fill="#c9a84c"/>
      <rect x="-70" y="88" width="140" height="6" rx="2" fill="#c9a84c"/>
      <circle cx="0" cy="86" r="8" fill="#c9a84c"/>
      <line x1="-70" y1="94" x2="-62" y2="155" stroke="#c9a84c" stroke-width="2.5"/>
      <ellipse cx="-66" cy="163" rx="38" ry="10" fill="#c9a84c"/>
      <line x1="70" y1="94" x2="62" y2="165" stroke="#c9a84c" stroke-width="2.5"/>
      <ellipse cx="66" cy="173" rx="38" ry="10" fill="#c9a84c"/>
      <rect x="-25" y="338" width="50" height="12" rx="6" fill="#c9a84c"/>
    </g>

    <!-- Desk surface -->
    <rect x="60" y="330" width="680" height="16" rx="3" fill="#1a0e05"/>
    <rect x="60" y="325" width="680" height="8" rx="3" fill="#2a1a0a" opacity="0.8"/>

    <!-- === BACKGROUND FOLDER (left, dark blue) === -->
    <g transform="translate(95, 165)" filter="url(#cl-shadow)">
      <!-- Tab -->
      <rect x="0" y="0" width="58" height="15" rx="3" fill="#1a3468"/>
      <!-- Body -->
      <rect x="0" y="12" width="170" height="150" rx="3" fill="#1a3468"/>
      <!-- Lines -->
      <rect x="16" y="32" width="138" height="5" rx="2" fill="#c9a84c" opacity="0.2"/>
      <rect x="16" y="46" width="118" height="5" rx="2" fill="#c9a84c" opacity="0.18"/>
      <rect x="16" y="60" width="128" height="5" rx="2" fill="#c9a84c" opacity="0.15"/>
      <rect x="16" y="74" width="100" height="5" rx="2" fill="#c9a84c" opacity="0.12"/>
      <rect x="16" y="88" width="120" height="5" rx="2" fill="#c9a84c" opacity="0.12"/>
      <rect x="16" y="102" width="90" height="5" rx="2" fill="#c9a84c" opacity="0.1"/>
    </g>

    <!-- === BACKGROUND FOLDER (far right) === -->
    <g transform="translate(542, 178)" filter="url(#cl-shadow)">
      <rect x="0" y="0" width="52" height="13" rx="3" fill="#243d6b"/>
      <rect x="0" y="10" width="158" height="140" rx="3" fill="#243d6b"/>
      <rect x="15" y="28" width="128" height="5" rx="2" fill="#c9a84c" opacity="0.18"/>
      <rect x="15" y="42" width="108" height="5" rx="2" fill="#c9a84c" opacity="0.15"/>
      <rect x="15" y="56" width="118" height="5" rx="2" fill="#c9a84c" opacity="0.12"/>
      <rect x="15" y="70" width="88" height="5" rx="2" fill="#c9a84c" opacity="0.1"/>
    </g>

    <!-- === MIDDLE FOLDER (slightly raised, mid-blue) === -->
    <g transform="translate(180, 155)" filter="url(#cl-shadow)">
      <rect x="0" y="0" width="64" height="16" rx="3" fill="#162d54"/>
      <rect x="0" y="13" width="185" height="162" rx="3" fill="#162d54"/>
      <rect x="18" y="34" width="149" height="5" rx="2" fill="#c9a84c" opacity="0.22"/>
      <rect x="18" y="48" width="129" height="5" rx="2" fill="#c9a84c" opacity="0.18"/>
      <rect x="18" y="62" width="140" height="5" rx="2" fill="#c9a84c" opacity="0.18"/>
      <rect x="18" y="76" width="110" height="5" rx="2" fill="#c9a84c" opacity="0.15"/>
      <rect x="18" y="90" width="135" height="5" rx="2" fill="#c9a84c" opacity="0.15"/>
      <rect x="18" y="104" width="100" height="5" rx="2" fill="#c9a84c" opacity="0.12"/>
      <rect x="18" y="118" width="120" height="5" rx="2" fill="#c9a84c" opacity="0.1"/>
    </g>

    <!-- === HIGHLIGHTED / SELECTED DOCUMENT (center, gold-lit) === -->
    <!-- Glow aura -->
    <rect x="310" y="122" width="198" height="218" rx="8" fill="#c9a84c" opacity="0.1" filter="url(#cl-brightglow)"/>
    <!-- Document shadow -->
    <rect x="316" y="136" width="192" height="200" rx="4" fill="#000" opacity="0.4" filter="url(#cl-shadow)"/>

    <g transform="translate(318, 128)" filter="url(#cl-shadow)">
      <!-- Document body (parchment) -->
      <rect x="0" y="0" width="190" height="198" rx="4" fill="url(#cl-doc)"/>
      <!-- Gold accent strip at top -->
      <rect x="0" y="0" width="190" height="6" rx="2" fill="#c9a84c" opacity="0.9"/>
      <!-- Header line (title) -->
      <rect x="18" y="20" width="154" height="8" rx="2" fill="#0d1f3c" opacity="0.65"/>
      <!-- Sub-header -->
      <rect x="18" y="35" width="120" height="5" rx="2" fill="#0d1f3c" opacity="0.45"/>
      <!-- Divider -->
      <rect x="18" y="48" width="154" height="1.5" rx="0.75" fill="#c9a84c" opacity="0.5"/>
      <!-- Body lines -->
      <rect x="18" y="58" width="154" height="5" rx="2" fill="#0d1f3c" opacity="0.5"/>
      <rect x="18" y="72" width="140" height="5" rx="2" fill="#0d1f3c" opacity="0.45"/>
      <rect x="18" y="86" width="148" height="5" rx="2" fill="#0d1f3c" opacity="0.45"/>
      <rect x="18" y="100" width="120" height="5" rx="2" fill="#0d1f3c" opacity="0.4"/>
      <rect x="18" y="118" width="154" height="5" rx="2" fill="#0d1f3c" opacity="0.4"/>
      <rect x="18" y="132" width="130" height="5" rx="2" fill="#0d1f3c" opacity="0.35"/>
      <rect x="18" y="146" width="144" height="5" rx="2" fill="#0d1f3c" opacity="0.35"/>
      <rect x="18" y="160" width="100" height="5" rx="2" fill="#0d1f3c" opacity="0.3"/>
      <!-- Checkmark badge -->
      <circle cx="155" cy="28" r="18" fill="#0d1f3c" opacity="0.85"/>
      <circle cx="155" cy="28" r="18" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>
      <polyline points="145,28 152,35 166,20" stroke="#c9a84c" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- === MAGNIFYING GLASS === -->
    <g transform="translate(468, 194)" filter="url(#cl-goldglow)">
      <!-- Outer ring glow -->
      <circle cx="0" cy="0" r="68" fill="#c9a84c" opacity="0.08"/>
      <!-- Glass frame -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="url(#cl-gold)" stroke-width="7"/>
      <!-- Glass interior (subtle tint) -->
      <circle cx="0" cy="0" r="51" fill="#c9a84c" opacity="0.06"/>
      <!-- Glass shine -->
      <ellipse cx="-16" cy="-18" rx="14" ry="7" fill="#ffffff" opacity="0.12" transform="rotate(-30,-16,-18)"/>
      <!-- Handle -->
      <line x1="41" y1="41" x2="94" y2="96" stroke="url(#cl-gold)" stroke-width="10" stroke-linecap="round"/>
      <line x1="44" y1="41" x2="96" y2="93" stroke="#e2c178" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- === BOTTOM LABEL BAR === -->
    <rect x="0" y="405" width="800" height="45" fill="#000" opacity="0.35"/>
    <rect x="0" y="405" width="800" height="2" fill="#c9a84c" opacity="0.5"/>
    <!-- Category pill -->
    <rect x="30" y="418" width="110" height="22" rx="11" fill="#c9a84c" opacity="0.2"/>
    <rect x="30" y="418" width="110" height="22" rx="11" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.5"/>
    <text x="85" y="433" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" letter-spacing="2" opacity="0.9">LEGAL TIPS</text>
    <!-- Firm name -->
    <text x="400" y="432" font-family="Georgia, serif" font-size="12" fill="#c9a84c" text-anchor="middle" letter-spacing="3" opacity="0.6">LAMZAI SOLICITORS</text>
    <!-- Date -->
    <text x="762" y="432" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="end" letter-spacing="1" opacity="0.55">MARCH 2026</text>

    <!-- === CORNER BRACKETS === -->
    <path d="M18,18 L18,46 M18,18 L46,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,18 L782,46 M782,18 L754,18" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M18,395 L18,367 M18,395 L46,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M782,395 L782,367 M782,395 L754,395" stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Thin border -->
    <rect x="8" y="8" width="784" height="434" fill="none" stroke="#c9a84c" stroke-width="0.75" opacity="0.2"/>
  </g>
</svg>
